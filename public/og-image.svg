<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#06102e"/>
      <stop offset="50%"  stop-color="#0c0a22"/>
      <stop offset="100%" stop-color="#071428"/>
    </linearGradient>
    <!-- Cyan glow for name -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Subtle grid pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00f5ff" stroke-width="0.4" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid overlay -->
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Radial vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="0%"   stop-color="transparent"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.65)"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- Left cyan accent bar -->
  <rect x="72" y="140" width="4" height="350" rx="2" fill="#00f5ff" opacity="0.8"/>

  <!-- Corner brackets -->
  <polyline points="40,40 40,80 80,80"           fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.45"/>
  <polyline points="1160,40 1160,80 1120,80"      fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.45"/>
  <polyline points="40,590 40,550 80,550"          fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.45"/>
  <polyline points="1160,590 1160,550 1120,550"    fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.45"/>

  <!-- Section label -->
  <text x="100" y="168" font-family="monospace" font-size="13" letter-spacing="4" fill="#00f5ff" opacity="0.6">// portfolio</text>

  <!-- Name -->
  <text x="100" y="265"
        font-family="Arial Black, Impact, sans-serif"
        font-size="82" font-weight="900" letter-spacing="4"
        fill="#00f5ff" filter="url(#glow)" opacity="0.95">
    JAGADEESH
  </text>
  <text x="100" y="355"
        font-family="Arial Black, Impact, sans-serif"
        font-size="82" font-weight="900" letter-spacing="4"
        fill="#ffffff" opacity="0.92">
    PALLI
  </text>

  <!-- Divider line -->
  <line x1="100" y1="382" x2="380" y2="382" stroke="#00f5ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Title -->
  <text x="100" y="420" font-family="Arial, sans-serif" font-size="26" font-weight="600"
        fill="rgba(255,255,255,0.85)" letter-spacing="1">
    Senior Software Engineer
  </text>

  <!-- Subtitle -->
  <text x="100" y="455" font-family="monospace" font-size="15" fill="#00f5ff" opacity="0.65" letter-spacing="1">
    &gt;_ Full-Stack Architect · Cloud Native · Microservices
  </text>

  <!-- Tech stack chips -->
  <g transform="translate(100, 485)">
    <!-- Java / Spring Boot -->
    <rect width="148" height="28" rx="5" fill="#00f5ff" fill-opacity="0.08" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="74" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#00f5ff" opacity="0.85">Java / Spring Boot</text>

    <!-- React / Angular -->
    <rect x="158" width="130" height="28" rx="5" fill="#00f5ff" fill-opacity="0.08" stroke="#00f5ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="223" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#00f5ff" opacity="0.85">React / Angular</text>

    <!-- AWS · GCP -->
    <rect x="298" width="108" height="28" rx="5" fill="#ff9500" fill-opacity="0.08" stroke="#ff9500" stroke-opacity="0.3" stroke-width="1"/>
    <text x="352" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff9500" opacity="0.85">AWS · GCP</text>

    <!-- Docker / K8s -->
    <rect x="416" width="112" height="28" rx="5" fill="#ff9500" fill-opacity="0.08" stroke="#ff9500" stroke-opacity="0.3" stroke-width="1"/>
    <text x="472" y="19" text-anchor="middle" font-family="monospace" font-size="11" fill="#ff9500" opacity="0.85">Docker / K8s</text>
  </g>

  <!-- Right side — stats -->
  <g transform="translate(850, 200)">
    <!-- 5+ years -->
    <text x="0" y="0" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#00f5ff" opacity="0.9">5+</text>
    <text x="0" y="26" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="3">YEARS EXP</text>

    <!-- 4 companies -->
    <text x="130" y="0" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#00f5ff" opacity="0.9">4</text>
    <text x="130" y="26" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="3">COMPANIES</text>

    <!-- 20+ projects -->
    <text x="0" y="105" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#ff9500" opacity="0.85">20+</text>
    <text x="0" y="131" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="3">PROJECTS</text>

    <!-- 3 certs -->
    <text x="130" y="105" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="#ff9500" opacity="0.85">3</text>
    <text x="130" y="131" font-family="monospace" font-size="12" fill="rgba(255,255,255,0.4)" letter-spacing="3">CLOUD CERTS</text>
  </g>

  <!-- Bottom URL bar -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(0,245,255,0.05)"/>
  <line x1="0" y1="590" x2="1200" y2="590" stroke="#00f5ff" stroke-width="0.5" opacity="0.25"/>
  <text x="100" y="614" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.35)" letter-spacing="2">jagadeeshpalli.dev</text>
  <text x="1100" y="614" text-anchor="end" font-family="monospace" font-size="13" fill="rgba(0,245,255,0.45)" letter-spacing="2">@ NYS Dept, Troy NY</text>
</svg>
